blueprint:
  name: "Werktags: switch off in the evening"
  description: >-
    Switches lights or switches off at one time on evenings before a workday
    and at a later time before a day off. Uses a Werktags "evening" sensor,
    which refers to tomorrow.
  domain: automation
  author: nickl3ss
  source_url: https://github.com/nickl3ss/werktags/blob/main/blueprints/automation/werktags/lights_off_in_the_evening.yaml
  input:
    evening_sensor:
      name: Evening sensor
      description: A Werktags evening sensor, e.g. sensor.house_evening.
      selector:
        entity:
          filter:
            - integration: werktags
              domain: sensor
    targets:
      name: Lights or switches
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    before_workday_time:
      name: Time before a workday
      default: "22:00:00"
      selector:
        time:
    before_day_off_time:
      name: Time before a day off
      default: "23:00:00"
      selector:
        time:

mode: single

triggers:
  - trigger: time
    at: !input before_workday_time
    id: before_workday
  - trigger: time
    at: !input before_day_off_time
    id: before_day_off

conditions:
  - condition: template
    value_template: >-
      {% set before_workday = states(evening_sensor) != 'before_day_off' %}
      {{ (trigger.id == 'before_workday' and before_workday)
         or (trigger.id == 'before_day_off' and not before_workday) }}

variables:
  evening_sensor: !input evening_sensor

actions:
  - action: homeassistant.turn_off
    target: !input targets
