[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openholidays"
version = "0.1.0"
description = "Async client for the OpenHolidays API (public and school holidays)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "nickl3ss" }]
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nickl3ss/werktage"
"Data source" = "https://www.openholidaysapi.org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openholidays = ["py.typed"]
