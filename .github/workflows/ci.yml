name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The one quality gate (bin/check): tests, lint, types, build sync, publication check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # tools/check_publication.py searches the whole history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: bin/check

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: home-assistant/actions/hassfest@master   # branch ref as upstream recommends (standards.yaml SEC-10)

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hacs/action@main                         # branch ref as upstream recommends (standards.yaml SEC-10)
        with:
          category: integration

  # The oldest Home Assistant release in hacs.json ("homeassistant"); keep both in step.
  minimum-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install -e lib/openholidays "holidays>=0.60" pytest-homeassistant-custom-component==0.13.308
      - run: python -m pytest -q tests
