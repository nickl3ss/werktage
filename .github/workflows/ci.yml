name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # the integration's own requirements (manifest.json) plus the test tooling
      - run: pip install -e lib/openholidays "holidays>=0.60" pytest-homeassistant-custom-component==0.13.367 pytest-cov mypy ruff
      - run: ruff check .
      - run: python -m mypy
      - run: python tools/check_publication.py --areas
      - run: python -m pytest -q --cov=custom_components/werktage --cov-report=term-missing --cov-fail-under=95

  # The oldest Home Assistant release in hacs.json ("homeassistant"); keep both in step.
  minimum-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e lib/openholidays "holidays>=0.60" pytest-homeassistant-custom-component==0.13.308
      - run: python -m pytest -q tests

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python3 tools/build_cards.py && git diff --exit-code custom_components/werktage/www
      - run: node --test frontend/test/*.test.mjs
