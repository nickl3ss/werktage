[tool.pytest.ini_options]
testpaths = ["tests", "lib/openholidays/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/werktage", "lib/openholidays/src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"lib/openholidays/tests/**" = ["E501"]

[tool.coverage.run]
# The vendored client is a byte-identical copy of lib/openholidays (tests/test_vendor.py)
# and is tested there against a local server.
omit = ["custom_components/werktage/openholidays/*"]

