rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: School holidays are fetched once a month; everything else is computed locally at midnight.
  brands:
    status: done
    comment: >-
      Shipped as local brand images in brand/ (icon, icon@2x, logo, logo@2x), which Home Assistant
      serves itself since 2026.3; the brands repository no longer accepts custom integrations.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no custom triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to the coordinator only, through CoordinatorEntity.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No account and no credentials; the OpenHolidays API is public.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Nothing to discover; the integration works on persons and areas of this Home Assistant.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: No devices; persons and areas are the subjects.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: All entities are primary; there are no diagnostic or configuration entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Three entities per resident, room and house, all meant for automations; none is noisy.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The options flow covers every setting; nothing is fixed at setup.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: done
    comment: >-
      The only network dependency, the OpenHolidays client, is asyncio (aiohttp). The holidays
      library is an offline computation and always runs in the executor, in the coordinator
      and in the config flow.
  inject-websession:
    status: done
    comment: The client receives Home Assistant's shared aiohttp session.
  strict-typing:
    status: done
    comment: mypy --strict in CI for the integration and the client library; the library ships py.typed.
